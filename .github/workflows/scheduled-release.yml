name: Scheduled Release and Publish

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  id-token: write

jobs:
  merge-release-branch:
    runs-on: ubuntu-latest
    outputs:
      release_found: ${{ steps.finder.outputs.release }}
      target_branch: ${{ steps.finder.outputs.target_branch }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Find release branch
        id: finder
        shell: bash
        run: |
          TODAY=$(date -u +'%Y-%m-%d')
          TARGET_BRANCH=""

          while read -r branch; do
            BRANCH_NAME="${branch#origin/}"
            BRANCH_DATE=$(echo "$BRANCH_NAME" | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' | head -n 1)

            if [ -z "$BRANCH_DATE" ]; then
              continue
            fi

            if [[ "$BRANCH_DATE" < "$TODAY" ]] || [[ "$BRANCH_DATE" == "$TODAY" ]]; then TARGET_BRANCH="$BRANCH_NAME"; break; fi

          done < <(git branch -r | grep 'origin/release/')

          if [ -z "$TARGET_BRANCH" ]; then
            echo "No branches found"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Found branch: $TARGET_BRANCH"
          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "target_branch=$TARGET_BRANCH" >> "$GITHUB_OUTPUT"

      - name: Merge release branch into main
        if: steps.finder.outputs.release == 'true'
        env:
          TARGET_BRANCH: ${{ steps.finder.outputs.target_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout main
          git merge "origin/$TARGET_BRANCH" --no-ff -m "release: merge $TARGET_BRANCH"
          git push origin main
          git push origin --delete "$TARGET_BRANCH"

  publish-nuget:
    needs: merge-release-branch
    if: needs.merge-release-branch.outputs.release_found == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main code
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - name: Test project
        run: |
          cd Tests/Unit/Csharp
          dotnet test

      - name: Clean solution
        run: dotnet clean

      - name: Build solution
        run: dotnet build -c Release

      - name: Pack NuGet Packages
        run: dotnet pack -c Release --output ./artifacts

      - name: NuGet Login (OIDC)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: nicky_sus

      - name: Push to NuGet.org
        run: |
          dotnet nuget push ./artifacts/*.nupkg \
            --source https://api.nuget.org/v3/index.json \
            --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} \
            --skip-duplicate

      - name: Get version
        id: version
        shell: bash
        run: |
          cd src/Csharp/Base
          VERSION=$(grep -oP '(?<=<Version>)[^<]+' Gamem.csproj)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Read CHANGELOG
        id: changelog
        shell: bash
        run: |
          if [ ! -f CHANGELOG.md ]; then
            echo "Couldn't find CHANGELOG.md"
            exit 1
          fi

          {
            echo 'body<<EOF'
            cat CHANGELOG.md
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.version.outputs.version }}"
          name: "Gamem ${{ steps.version.outputs.version }}"
          body: ${{ steps.changelog.outputs.body }}
          files: ./artifacts/*.nupkg
      - name: Delete CHANGELOG.md from main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git rm CHANGELOG.md
          git commit -m "Delete CHANGELOG.md after release"
          git push origin main